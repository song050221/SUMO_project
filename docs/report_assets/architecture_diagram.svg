<svg viewBox="0 0 1280 860" xmlns="http://www.w3.org/2000/svg" role="img">
<title>V2N 중앙 제어 시스템 구조도</title>
<desc>SUMO 시뮬레이션과 하드웨어 실물 시연이 decision_policy라는 하나의 판단 로직을 공유하는 구조. SUMO 쪽은 추가로 상시 최적화 계층(중앙 서버 재계산, 신호 제어, 선제적 우회)을 가진다.</desc>

<defs>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="1.2" cy="1.2" r="1.2" fill="#c7cdd8" opacity="0.35"/>
  </pattern>
  <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#3f66e6"/>
    <stop offset="100%" stop-color="#2647b8"/>
  </linearGradient>
  <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1b2436" flood-opacity="0.16"/>
  </filter>
  <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 Z" fill="#3f66e6"/>
  </marker>
  <marker id="arrowAmber" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 Z" fill="#a9722f"/>
  </marker>
</defs>

<rect x="0" y="0" width="1280" height="860" fill="#faf9f6"/>
<rect x="0" y="0" width="1280" height="860" fill="url(#dots)"/>

<!-- Title -->
<text x="640" y="46" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="12.5" font-weight="700" letter-spacing="3" fill="#3f66e6">V2N 통합 제어 시스템</text>
<text x="640" y="78" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#1c2430">하나의 판단 로직으로 시뮬레이션과 실물 하드웨어를 함께 움직인다</text>

<!-- Two environment panels -->
<rect x="66" y="112" width="524" height="340" rx="20" fill="#eef3fb" stroke="#d3e0f5" stroke-width="1.5"/>
<rect x="690" y="112" width="524" height="340" rx="20" fill="#faf3ea" stroke="#ecdec8" stroke-width="1.5"/>

<text x="328" y="146" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="15" font-weight="700" fill="#2647b8">SUMO 시뮬레이션</text>
<text x="952" y="146" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="15" font-weight="700" fill="#a9722f">하드웨어 실물 시연</text>

<!-- Left: sensing node -->
<g filter="url(#softShadow)">
  <rect x="188" y="172" width="280" height="92" rx="16" fill="#ffffff" stroke="#d7dfef" stroke-width="1.3"/>
</g>
<!-- camera icon -->
<g transform="translate(214,196)">
  <rect x="0" y="6" width="30" height="20" rx="4" fill="none" stroke="#2647b8" stroke-width="2"/>
  <circle cx="15" cy="16" r="6" fill="none" stroke="#2647b8" stroke-width="2"/>
  <rect x="9" y="0" width="12" height="7" rx="2" fill="#2647b8"/>
</g>
<text x="264" y="204" font-family="Malgun Gothic, sans-serif" font-size="14.5" font-weight="700" fill="#1c2430">CCTV 실시간 감지</text>
<text x="264" y="226" font-family="Malgun Gothic, sans-serif" font-size="12" fill="#5b6472">cctv_detector.py</text>
<text x="264" y="246" font-family="Malgun Gothic, sans-serif" font-size="11.5" fill="#7a8290">보행자 · 사고 · 정체를 9개 구역에서 상시 스캔</text>

<!-- Left: actuation node -->
<g filter="url(#softShadow)">
  <rect x="188" y="330" width="280" height="92" rx="16" fill="#ffffff" stroke="#d7dfef" stroke-width="1.3"/>
</g>
<g transform="translate(214,354)">
  <rect x="2" y="10" width="26" height="12" rx="4" fill="none" stroke="#2647b8" stroke-width="2"/>
  <path d="M6,10 L10,2 L20,2 L24,10" fill="none" stroke="#2647b8" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="8" cy="24" r="3.4" fill="#2647b8"/>
  <circle cx="22" cy="24" r="3.4" fill="#2647b8"/>
</g>
<text x="264" y="362" font-family="Malgun Gothic, sans-serif" font-size="14.5" font-weight="700" fill="#1c2430">가상 차량 제어</text>
<text x="264" y="384" font-family="Malgun Gothic, sans-serif" font-size="12" fill="#5b6472">vehicle_controller.py · TraCI</text>
<text x="264" y="404" font-family="Malgun Gothic, sans-serif" font-size="11.5" fill="#7a8290">STOP·REROUTE·SLOW 명령을 SUMO 차량에 즉시 적용</text>

<!-- Right: sensing node -->
<g filter="url(#softShadow)">
  <rect x="812" y="172" width="280" height="92" rx="16" fill="#ffffff" stroke="#ecdec8" stroke-width="1.3"/>
</g>
<g transform="translate(838,196)">
  <rect x="0" y="6" width="30" height="20" rx="4" fill="none" stroke="#a9722f" stroke-width="2"/>
  <circle cx="15" cy="16" r="6" fill="none" stroke="#a9722f" stroke-width="2"/>
  <rect x="9" y="0" width="12" height="7" rx="2" fill="#a9722f"/>
</g>
<text x="888" y="204" font-family="Malgun Gothic, sans-serif" font-size="14.5" font-weight="700" fill="#1c2430">YOLO 카메라 감지</text>
<text x="888" y="226" font-family="Malgun Gothic, sans-serif" font-size="12" fill="#5b6472">vision/main.py (하드웨어팀)</text>
<text x="888" y="246" font-family="Malgun Gothic, sans-serif" font-size="11.5" fill="#7a8290">실물 보드 위 차량·보행자 좌표를 UDP로 전송</text>

<!-- Right: actuation node -->
<g filter="url(#softShadow)">
  <rect x="812" y="330" width="280" height="92" rx="16" fill="#ffffff" stroke="#ecdec8" stroke-width="1.3"/>
</g>
<g transform="translate(838,352)">
  <circle cx="14" cy="14" r="13" fill="none" stroke="#a9722f" stroke-width="2"/>
  <circle cx="14" cy="14" r="4" fill="#a9722f"/>
  <line x1="14" y1="1" x2="14" y2="6" stroke="#a9722f" stroke-width="2"/>
  <line x1="14" y1="22" x2="14" y2="27" stroke="#a9722f" stroke-width="2"/>
  <line x1="1" y1="14" x2="6" y2="14" stroke="#a9722f" stroke-width="2"/>
  <line x1="22" y1="14" x2="27" y2="14" stroke="#a9722f" stroke-width="2"/>
</g>
<text x="888" y="362" font-family="Malgun Gothic, sans-serif" font-size="14.5" font-weight="700" fill="#1c2430">RC카 실주행 제어</text>
<text x="888" y="384" font-family="Malgun Gothic, sans-serif" font-size="12" fill="#5b6472">live_demo_controller.py · UDP</text>
<text x="888" y="404" font-family="Malgun Gothic, sans-serif" font-size="11.5" fill="#7a8290">STOP·SLOW·FOLLOW_PATH 판단을 실차에 즉시 전송</text>

<!-- Core hexagon, bridging the gap between panels -->
<g filter="url(#softShadow)">
  <polygon points="640,150 706,192 706,278 640,320 574,278 574,192" fill="url(#coreGrad)" stroke="#1c3a94" stroke-width="1.5"/>
</g>
<text x="640" y="222" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="700" fill="#ffffff">decision_policy</text>
<text x="640" y="242" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="11" fill="#dbe4fb">STOP &gt; REROUTE &gt; SLOW</text>
<text x="640" y="260" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="10" fill="#b9c8f5">TraCI 비의존 · 공용 판단 로직</text>

<!-- Curved connectors: sensing -> core -->
<path d="M468,206 C 540,206 520,206 574,208" fill="none" stroke="#3f66e6" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
<path d="M812,206 C 740,206 760,206 706,208" fill="none" stroke="#a9722f" stroke-width="2.2" marker-end="url(#arrowAmber)"/>
<!-- Curved connectors: core -> actuation -->
<path d="M596,296 C 560,330 500,350 468,362" fill="none" stroke="#3f66e6" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
<path d="M684,296 C 720,330 780,350 812,362" fill="none" stroke="#a9722f" stroke-width="2.2" marker-end="url(#arrowAmber)"/>

<!-- SUMO-only extension band -->
<line x1="328" y1="452" x2="328" y2="486" stroke="#c7b28a" stroke-width="2" stroke-dasharray="3,3"/>
<rect x="66" y="486" width="1148" height="150" rx="18" fill="#fdf6ea" stroke="#eddcb8" stroke-width="1.3"/>
<text x="94" y="516" font-family="Malgun Gothic, sans-serif" font-size="13.5" font-weight="700" fill="#8a5a1e">SUMO 전용 — 상시 네트워크 최적화 계층 (하드웨어 시연에는 아직 미적용)</text>

<g transform="translate(94,540)">
  <rect x="0" y="0" width="352" height="72" rx="12" fill="#ffffff" stroke="#eddcb8" stroke-width="1.2"/>
  <text x="18" y="26" font-family="Malgun Gothic, sans-serif" font-size="13" font-weight="700" fill="#1c2430">central_server.py</text>
  <text x="18" y="46" font-family="Malgun Gothic, sans-serif" font-size="11" fill="#7a8290">출발 시 + 주행 중 60초마다</text>
  <text x="18" y="62" font-family="Malgun Gothic, sans-serif" font-size="11" fill="#7a8290">실시간 경로 재계산</text>
</g>
<g transform="translate(464,540)">
  <rect x="0" y="0" width="352" height="72" rx="12" fill="#ffffff" stroke="#eddcb8" stroke-width="1.2"/>
  <text x="18" y="26" font-family="Malgun Gothic, sans-serif" font-size="13" font-weight="700" fill="#1c2430">signal_controller.py</text>
  <text x="18" y="46" font-family="Malgun Gothic, sans-serif" font-size="11" fill="#7a8290">대기열 비교 → 급한 방향에</text>
  <text x="18" y="62" font-family="Malgun Gothic, sans-serif" font-size="11" fill="#7a8290">신호 시간 비례 배분</text>
</g>
<g transform="translate(834,540)">
  <rect x="0" y="0" width="352" height="72" rx="12" fill="#ffffff" stroke="#eddcb8" stroke-width="1.2"/>
  <text x="18" y="26" font-family="Malgun Gothic, sans-serif" font-size="13" font-weight="700" fill="#1c2430">predictive_reroute.py</text>
  <text x="18" y="46" font-family="Malgun Gothic, sans-serif" font-size="11" fill="#7a8290">혼잡 예상 지점을 미리 계산해</text>
  <text x="18" y="62" font-family="Malgun Gothic, sans-serif" font-size="11" fill="#7a8290">여유 있는 차량만 선제 우회</text>
</g>

<!-- Footer note -->
<text x="640" y="678" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="10.5" fill="#9aa2b0">중앙의 decision_policy.py는 TraCI를 호출하지 않는다 — 그래서 SUMO 시뮬레이션과 하드웨어(SUMO 미설치 PC)에서 동일 코드를 그대로 재사용할 수 있다.</text>

</svg>
